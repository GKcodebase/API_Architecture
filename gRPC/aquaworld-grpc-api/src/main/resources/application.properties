# ==============================================================
# AquaWorld gRPC API Application Configuration
# ==============================================================

# Application name
spring.application.name=aquaworld-grpc-api

# ======================== gRPC Configuration ========================
grpc.server.port=9090
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=30s
grpc.server.keep-alive-timeout=5s
grpc.server.permit-keep-alive-without-calls=true
grpc.server.max-concurrent-streams=100

# ======================== Database Configuration ========================
# H2 Database
spring.datasource.url=jdbc:h2:mem:aquaworld
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ======================== JWT Configuration ========================
# JWT Secret (must be at least 64 bytes for HS512 algorithm)
# This is a 512-bit (64-byte) base64-encoded key for production security
jwt.secret=Z2f1blZ0OWNdQVsnPkMrSyooWzw6JCF+MmVEWFpTRF5HQiNmQVBdXUVIUipmI3lQWkxGRWQmUi85
jwt.expiration=86400000

# ======================== Logging Configuration ========================
logging.level.root=INFO
logging.level.com.aquaworld=DEBUG
logging.level.io.grpc=INFO
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ======================== Server Configuration ========================
server.shutdown=graceful
server.port=8081

# ======================== Actuator Configuration ========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
