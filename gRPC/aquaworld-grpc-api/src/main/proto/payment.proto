syntax = "proto3";

package com.aquaworld.grpc.payment;

option java_multiple_files = true;
option java_package = "com.aquaworld.grpc.payment";
option java_outer_classname = "PaymentServiceProto";

import "common.proto";

message Payment {
  string payment_id = 1;
  string order_id = 2;
  double amount = 3;
  string payment_method = 4;
  string status = 5;
  string transaction_id = 6;
  int64 created_at = 7;
}

message ProcessPaymentRequest {
  string order_id = 1;
  double amount = 2;
  string payment_method = 3;
  PaymentDetails details = 4;
}

message PaymentDetails {
  string card_number = 1;
  string card_holder = 2;
  string expiry_date = 3;
  string cvv = 4;
  string bank_account = 5;
  string upi_id = 6;
}

message ProcessPaymentResponse {
  bool success = 1;
  Payment payment = 2;
  string message = 3;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message GetPaymentStatusRequest {
  string payment_id = 1;
}

message PaymentStatusRequest {
  string order_id = 1;
}

message RefundPaymentRequest {
  string payment_id = 1;
  double amount = 2;
  string reason = 3;
}

service PaymentService {
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (Payment);
  rpc GetPaymentStatus(PaymentStatusRequest) returns (Payment);
  rpc RefundPayment(RefundPaymentRequest) returns (com.aquaworld.grpc.ApiResponse);
}
