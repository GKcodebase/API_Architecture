syntax = "proto3";

package com.aquaworld.grpc.order;

option java_multiple_files = true;
option java_package = "com.aquaworld.grpc.order";
option java_outer_classname = "OrderServiceProto";

import "common.proto";

message OrderItem {
  string item_id = 1;
  string product_id = 2;
  string product_name = 3;
  int32 quantity = 4;
  double unit_price = 5;
  double subtotal = 6;
}

message Order {
  string order_id = 1;
  string user_id = 2;
  repeated OrderItem items = 3;
  double total_amount = 4;
  string status = 5;
  string shipping_address = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message CreateOrderRequest {
  repeated OrderItem items = 1;
  string shipping_address = 2;
}

message CreateOrderResponse {
  bool success = 1;
  Order order = 2;
  string message = 3;
}

message GetOrderRequest {
  string order_id = 1;
}

message ListOrdersRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string status = 4;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  com.aquaworld.grpc.PageInfo page_info = 2;
}

message CancelOrderRequest {
  string order_id = 1;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  string status = 2;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc CancelOrder(CancelOrderRequest) returns (com.aquaworld.grpc.ApiResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (Order);
}
